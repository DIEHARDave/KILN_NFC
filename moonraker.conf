# KILN_NFC's Moonraker part (Kiln OS includes it while the plugin is on):
# updates from Fluidd (Settings > Software Updates). After an update,
# RESTART Klipper; if NFC_STATUS then says the USB hook is outdated, run
# install.sh again as root.
[update_manager kiln-nfc]
type: git_repo
path: /data/ad5x/plugins/nfc
origin: https://github.com/DIEHARDave/KILN_NFC.git
primary_branch: main
is_system_service: False
managed_services: klipper
